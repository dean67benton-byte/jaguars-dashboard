name: UI preview

# Builds every claude/** branch and takes iPhone and desktop screenshots, so
# design changes can be reviewed before merge. Screenshots are force-pushed to
# the ui-previews branch (latest run only). Uses no Claude usage.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fresh data so previews show what the next data run will produce (not committed).
      - run: node scripts/fetch-data.mjs --force && node scripts/rankings.mjs --force && node scripts/nfl.mjs --force && node scripts/portal.mjs --force
        continue-on-error: true
      - run: node scripts/swag.mjs --force
        continue-on-error: true
      - run: npm run build

      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          npx -y wait-on@8.0.1 -t 60000 http://localhost:4173/
          mkdir -p shots
          npm i --no-save playwright-core@1.48.2
          node scripts/ui-shots.mjs

      - name: Publish to ui-previews branch
        run: |
          cd shots
          echo "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}" > README.md
          git init -q -b ui-previews
          git config user.name "jaguars-preview-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "UI preview for ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-previews
