name: Swag site probe

# Temporary: saves store pages to the swag-samples branch so the scraper can be
# written against real responses. Delete before merge.
on:
  push:
    branches: ['claude/project-thread-qhi1ab']
    paths: ['.github/workflows/swag-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          mkdir out && cd out
          while read -r name u; do
            curl -sL -o "$name" -m 25 -A "$UA" -w "%{http_code} $name\n" "$u" | tee -a index.txt
          done <<'LIST'
          rh-browse.json https://ac.cnstrc.com/browse/group_id/college_south-alabama-jaguars?key=key_vEmtX5xxkx8IfLkr&num_results_per_page=100
          rh-search.json https://ac.cnstrc.com/search/south%20alabama%20jaguars?key=key_vEmtX5xxkx8IfLkr&num_results_per_page=100
          jt-sitemap.xml https://www.jagthreadsco.com/sitemap.xml
          jt-api1.json https://www.jagthreadsco.com/app/store/api/v28/editor/users/-/sites/410866993550648244/products?per_page=100
          jt-api2.json https://cdn5.editmysite.com/app/store/api/v28/editor/sites/410866993550648244/products?per_page=100
          jt-api3.json https://www.jagthreadsco.com/app/store/api/v28/editor/sites/410866993550648244/products?per_page=100
          js-main.js https://jagswag.com/main.89f5daa9fb4b641754dc.js
          js-sitemap.xml https://jagswag.com/sitemap.xml
          at-suggest.json https://athletesthread.com/search/suggest.json?q=south+alabama&resources%5Btype%5D=product&resources%5Blimit%5D=10
          at-sitemap.xml https://athletesthread.com/sitemap.xml
          LIST
          git init -q && git checkout -q -b swag-samples && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm samples
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" swag-samples
