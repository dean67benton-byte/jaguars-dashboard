name: Swag site probe

# Temporary: checks which store sites GitHub Actions can reach. Delete before merge.
on:
  push:
    branches: ['claude/project-thread-qhi1ab']
    paths: ['.github/workflows/swag-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          while read -r u; do
            curl -sL -o /tmp/p -m 20 -A "$UA" "$u"
            echo "=== $u"
            grep -oiE 'shopify|bigcommerce|wix\.com|squarespace|woocommerce|__NEXT_DATA__|"@type":"Product"' /tmp/p | sort | uniq -c | head
            grep -oE '"(price|salePrice|regularPrice|compare_at_price|priceString|linePrice)":[^,]{1,30}' /tmp/p | head -4
            grep -oE '\$[0-9]+\.[0-9]{2}' /tmp/p | head -4 | tr '\n' ' '; echo
            grep -oE '/(products|product|ip)/[a-z0-9-]{5,60}' /tmp/p | sort -u | head -3
          done <<'LIST'
          https://www.jagthreadsco.com/
          https://www.jagthreadsco.com/shop
          https://jagswag.com/
          https://athletesthread.com/collections/university-of-south-alabama
          https://www.rallyhouse.com/college/south-alabama-jaguars
          https://www.walmart.com/tp/south-alabama-jaguars-fan-shop
          LIST
