name: Swag site probe

# Temporary: checks which store sites GitHub Actions can reach. Delete before merge.
on:
  push:
    branches: ['claude/project-thread-qhi1ab']
    paths: ['.github/workflows/swag-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          while read -r u; do
            code=$(curl -sL -o /tmp/p -m 20 -A "$UA" -w "%{http_code}" "$u" || echo ERR)
            size=$(wc -c < /tmp/p 2>/dev/null || echo 0)
            prices=$(grep -oE '\$[0-9]+\.[0-9]{2}|"price":"?[0-9.]+' /tmp/p | wc -l)
            jl=$(grep -c 'application/ld+json' /tmp/p)
            title=$(grep -oE '<title>[^<]{0,80}' /tmp/p | head -1)
            echo "$code bytes=$size prices=$prices ldjson=$jl $u $title"
          done <<'LIST'
          https://www.jagthreadsco.com/products.json?limit=5
          https://jagswag.com/products.json?limit=5
          https://scarletandgoldshop.com/collections/south-alabama-adult-apparel/products.json?limit=5
          https://athletesthread.com/collections/university-of-south-alabama/products.json?limit=5
          https://www.foco.com/collections/south-alabama-jaguars/products.json?limit=5
          https://www.jagthreadsco.com/
          https://jagswag.com/
          https://www.dickssportinggoods.com/f/south-alabama-jaguars-apparel-gear
          https://scarletandgoldshop.com/collections/south-alabama-adult-apparel
          https://southalabama.spirit.bncollege.com/
          https://athletesthread.com/collections/university-of-south-alabama
          https://southalabama.shoptruespirit.com/
          https://www.fanatics.com/college/south-alabama-jaguars/o-38+t-35787497+z-984027-4255658954
          https://www.shopncaasports.com/south-alabama-jaguars/t-24566308+z-9163524-4284178966
          https://www.foco.com/collections/south-alabama-jaguars
          https://www.prepsportswear.com/college/us/alabama/mobile/university-of-south-alabama-jaguars?schoolid=2302237
          https://www.walmart.com/tp/south-alabama-jaguars-fan-shop
          https://www.rallyhouse.com/college/south-alabama-jaguars
          https://www.etsy.com/market/south_alabama_clothing
          LIST
