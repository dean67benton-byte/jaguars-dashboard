name: Swag site probe

# Temporary: saves store pages to the swag-samples branch so the scraper can be
# written against real responses. Delete before merge.
on:
  push:
    branches: ['claude/project-thread-qhi1ab']
    paths: ['.github/workflows/swag-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          mkdir out && cd out
          while read -r name u; do
            curl -sL -o "$name" -m 25 -A "$UA" -w "%{http_code} $name\n" "$u" | tee -a index.txt
          done <<'LIST'
          sg.json https://scarletandgoldshop.com/collections/south-alabama-adult-apparel/products.json?limit=250
          foco.json https://www.foco.com/collections/south-alabama-jaguars/products.json?limit=250
          at.html https://athletesthread.com/collections/university-of-south-alabama
          at-all.json https://athletesthread.com/products.json?limit=250
          at-search.json https://athletesthread.com/search/suggest.json?q=south+alabama&resources[type]=product&resources[limit]=10
          jt.html https://www.jagthreadsco.com/
          jt-shop.html https://www.jagthreadsco.com/shop
          jt-shopall.html https://www.jagthreadsco.com/shop-all
          js.html https://jagswag.com/
          js-pj.json https://jagswag.com/products.json
          rh.html https://www.rallyhouse.com/college/south-alabama-jaguars
          wm.html https://www.walmart.com/tp/south-alabama-jaguars-fan-shop
          wm-search.html https://www.walmart.com/search?q=south+alabama+jaguars+shirt
          LIST
          git init -q && git checkout -q -b swag-samples && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm samples
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" swag-samples
