name: Swag site probe

# Temporary: saves store pages to the swag-samples branch so the scraper can be
# written against real responses. Delete before merge.
on:
  push:
    branches: ['claude/project-thread-qhi1ab']
    paths: ['.github/workflows/swag-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          mkdir out && cd out
          while read -r name u; do
            curl -sL -o "$name" -m 25 -A "$UA" -w "%{http_code} $name\n" "$u" | tee -a index.txt
          done <<'LIST'
          jt-prod.html https://www.jagthreadsco.com/product/fleece-hoodie/OCWRI226PLWQ6PMCKP45GG32
          jt-prod2.html https://www.jagthreadsco.com/product/cutter-buck-navy/W5WJTOM4K5NVC5M2WL24BGAV
          LIST
          H="Accept: application/x.gatewayapi.v1.3+json"
          curl -sL -m 25 -A "$UA" -H "$H" -o js-site.json -w "%{http_code} js-site.json\n" "https://affinity-gateway.com/api/marketplace/sites?domain=jagswag.com&includes=navLinks,organizations" | tee -a index.txt
          SID=$(grep -oE '"id":[0-9]+' js-site.json | head -1 | cut -d: -f2); echo "site $SID" | tee -a index.txt
          curl -sL -m 25 -A "$UA" -H "$H" -o js-products.json -w "%{http_code} js-products.json\n" "https://affinity-gateway.com/api/marketplace/products?site_id=$SID&page=1&per_page=36&include=variants" | tee -a index.txt
          curl -sL -m 25 -A "$UA" -H "$H" -o js-products2.json -w "%{http_code} js-products2.json\n" "https://affinity-gateway.com/api/marketplace/products?site_id=$SID&page=1&per_page=36&sort=newest" | tee -a index.txt
          cat > /dev/null <<'LIST'
          LIST
          git init -q && git checkout -q -b swag-samples && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm samples
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" swag-samples
